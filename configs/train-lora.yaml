defaults:
  - model: Llama-3.2-1B-Instruct-lora
  - trainer: FederatedFinetune
  - data: finetune
  - collator: DataCollatorForSupervisedDataset
  - eval: tofu
  - hydra: default
  - paths: default
  - experiment: null
  - _self_

trainer:
  args: 
    remove_unused_columns: False

mode: train

# 这里是添加的 datasets 配置组
datasets:
  data:
    train:
      TOFU_QA_retain:
        args:
          hf_args:
            name: "retain99"  # 这里定义数据集的分割名，例如 "retain99"
          
task_name: "3B_FedAvg_Retain_retain99"  # 设置任务名称