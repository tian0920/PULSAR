handler: FederatedPermTrainer
method_args:
  num_clients: 5
  target_client_idx: 1
  revoker_client_idx: 0
  aggregation_strategy: "FedAvg"
  global_rounds: 10
  filter_alpha: 1.0
  aggregation_lr: 1.0
  enable_revocation: true
  revocation_round: 3
args:
  output_dir: "output/fedperm"
  seed: 42
  do_train: true
  do_eval: false
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 1
  learning_rate: 2.0e-5
  weight_decay: 0.01
  num_train_epochs: 3
  warmup_ratio: 0.1
  logging_steps: 50
  save_strategy: "epoch"
  fp16: true
  unlearn_epochs: 1        # 过滤器 / 遗忘阶段的专用 epoch 数